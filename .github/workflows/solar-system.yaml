name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/*"

env:
  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
          
    env:
      MONGO_URI: "mongodb://localhost:27017/superData"
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache NPM Dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mocha-test-results
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    container: 
      image: node:18
    
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options:
          --name mongo
          
    env:
      MONGO_URI: "mongodb://mongo:27017/superData"
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      # - name: Setup NodeJS Version - 18
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 18

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache NPM Dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage
          retention-days: 5

  reports-s3:
    name: Upload Reports to AWS S3 Bucket
    runs-on: ubuntu-latest
    needs: [unit-testing, code-coverage]
    continue-on-error: true
    
    steps:
      - name: Download Unit Test Results
        uses: actions/download-artifact@v7
        with:
          name: mocha-test-results

      - name: Download Code Coverage Report
        uses: actions/download-artifact@v7 
        with:
          name: code-coverage-report
      
      - name: Merge Test Files
        run: |
          ls -ltr

          mkdir reports-${{ github.sha }}

          mv cobertura-coverage.xml reports-${{ github.sha }}/
          mv test-results.xml reports-${{ github.sha }}/

          ls -ltr reports-${{ github.sha }}

      - name: Upload to DigitalOcean Spaces
        uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SPACES_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACES_BUCKET }}
          space_region: ${{ secrets.DO_SPACES_REGION }}
          source: reports-${{ github.sha }}
          out_dir: reports-${{ github.sha }}

  docker:
    name: Containerization
    runs-on: ubuntu-latest
    
    needs: [unit-testing, code-coverage]
    permissions:
      packages: write

    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Build for Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
            --publish 3000:3000 \
            --env MONGO_URI=$MONGO_URI \
            --env MONGO_USERNAME=$MONGO_USERNAME \
            --env MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using Wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Container Registry Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
  
  dev-deploy:
    name: Start of CD Pipeline
    if: contains(github.ref, 'feature/')
    needs: docker

    uses: ./.github/workflows/reuse-deployment.yaml
    secrets:
      k8s-kubeconfig: ${{ secrets.KUBECONFIG }}
      mongodb-password: ${{ secrets.MONGO_PASSWORD }}
    with:
      mongodb-uri: ${{ vars.MONGO_URI }}
      environment: development
      k8s-manifest-dir: kubernetes/development/

  dev-integration-testing:
    if: contains(github.ref, 'feature/')

    name: Development Integration Testing
    needs: dev-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Test URL Output using CURL and JQ
        env:
          URL: ${{ needs.dev-deploy.outputs.application-url }}
        run: | 
          sleep 10
          echo $URL
          echo -------------------------------------------
          curl https://$URL/live -s -k | jq -r .status | grep -i live

  prod-deploy:
    name: Start of Production
    if: github.ref == 'refs/heads/main'
    needs: docker

    uses: ./.github/workflows/reuse-deployment.yaml
    secrets:
      k8s-kubeconfig: ${{ secrets.KUBECONFIG }}
      mongodb-password: ${{ secrets.MONGO_PASSWORD }}
    with:
      mongodb-uri: ${{ vars.MONGO_URI }}
      environment: production
      k8s-manifest-dir: kubernetes/staging/

  prod-integration-test:
    if: github.ref == 'refs/heads/main'

    name: Production Integration Testing
    needs: prod-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Test URL Output using CURL and JQ
        env:
          URL: ${{ needs.prod-deploy.outputs.application-url }}
        run: | 
          sleep 10
          echo $URL
          echo -------------------------------------------
          curl https://$URL/live -s -k | jq -r .status | grep -i live 

  